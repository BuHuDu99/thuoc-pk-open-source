name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm --dir duoc-tra-cuu install --frozen-lockfile
      - run: pnpm --dir duoc-tra-cuu build
      - run: pnpm --dir thuoc-pk-windows install --frozen-lockfile
      - run: pnpm --dir thuoc-pk-windows test
      - run: pnpm --dir thuoc-pk-windows check
