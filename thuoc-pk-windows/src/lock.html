<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tra cứu · Mở khóa</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 22px; color: #0000a0; background: #ffffff; font: 14px/1.5 Arial, sans-serif; }
      main { width: min(100%, 360px); padding: 30px 26px 25px; border: 1px solid #91b5ce; border-radius: 20px; background: #fff; box-shadow: 0 8px 30px rgba(30,60,90,.06); }
      .brand { display: flex; align-items: center; gap: 11px; }
      .mark { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid #91b5ce; border-radius: 14px; color: #0000a0; background: #fff; font-size: 24px; font-weight: 700; }
      .brand strong { display: block; font-size: 18px; }
      .brand span { color: #36536b; font-size: 12px; }
      h1 { margin: 27px 0 6px; font-size: 22px; letter-spacing: -.02em; }
      p { margin: 0; color: #36536b; }
      label { display: block; margin-top: 22px; color: #222; font-size: 12px; font-weight: 700; }
      input { width: 100%; height: 49px; margin-top: 7px; padding: 0 14px; border: 1px solid #91b5ce; border-radius: 11px; outline: 0; color: #0000a0; background: #fff; font: 20px/1 Arial, sans-serif; letter-spacing: .18em; }
      input:focus { background: #fffde7; border-color: #0000a0; box-shadow: 0 0 0 3px rgba(0,0,0,.11); }
      button { width: 100%; height: 44px; margin-top: 14px; border: 1px solid #91b5ce; border-radius: 11px; color: #0000a0; background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #e4f4ff; }
      button:disabled { opacity: .62; cursor: wait; }
      .message { min-height: 21px; margin-top: 10px; color: #36536b; font-size: 12px; text-align: center; }
      .message.error { color: #0000a0; font-weight: 700; }
      .message.success { color: #0000a0; }
      .hint { margin-top: 14px; padding-top: 14px; border-top: 1px solid #ddd; color: #36536b; font-size: 11px; text-align: center; }
    </style>
    <link rel="stylesheet" href="cis-ui.css" />
    <link rel="stylesheet" href="local-pages.css" />
  </head>
  <body>
    <main>
      <div class="brand"><div class="mark">+</div><div><strong>Tra cứu</strong><span>Ứng dụng cá nhân</span></div></div>
      <h1>Nhập mã khóa</h1>
      <p>Cần xác thực trước khi mở nội dung tra cứu.</p>
      <form id="lock-form">
        <label for="passcode">Mã khóa</label>
        <input id="passcode" name="passcode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-describedby="message" />
        <button id="unlock-button" type="submit">Mở ứng dụng</button>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </form>
      <div class="hint">Đóng cửa sổ sẽ thu ứng dụng xuống khay hệ thống.</div>
    </main>
    <script src="lock.js"></script>
  </body>
</html>
